spring:
  application:
    name: time-tracking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timetracking}
    username: ${DB_USER:timetracking}
    password: ${DB_PASSWORD:timetracking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
