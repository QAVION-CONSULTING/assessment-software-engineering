spring.application.name=timetracker

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:first}
spring.datasource.username=${POSTGRES_USER:dbuser}
spring.datasource.password=${POSTGRES_PASSWORD:dbpass}

spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=*:future
spring.datasource.hikari.maximum-pool-size=5
