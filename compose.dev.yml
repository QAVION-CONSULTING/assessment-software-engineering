services:
  backend:
    ports:
      - "8080:8080" 

  frontend-dev:
    image: node:24-alpine
    container_name: timetracker-frontend-dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_API_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  frontend_node_modules:
